import java.util.Properties

plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def cfg = { String propertyName, String envName ->
    def value = localProps.getProperty(propertyName)
    if (value == null || value.trim().isEmpty()) {
        value = System.getenv(envName)
    }
    return value == null ? "" : value.trim()
}

def signingStoreFile = System.getenv('PHONE_RUNNER_SIGNING_STORE_FILE') ?: ''
def signingStorePassword = System.getenv('PHONE_RUNNER_SIGNING_STORE_PASSWORD') ?: ''
def signingKeyAlias = System.getenv('PHONE_RUNNER_SIGNING_KEY_ALIAS') ?: ''
def signingKeyPassword = System.getenv('PHONE_RUNNER_SIGNING_KEY_PASSWORD') ?: ''

android {
    namespace 'com.wanttalk.phonerunner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wanttalk.phonerunner'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.2.6'

        resValue 'string', 'google_app_id', cfg('firebase.applicationId', 'FIREBASE_APPLICATION_ID')
        resValue 'string', 'gcm_defaultSenderId', cfg('firebase.senderId', 'FIREBASE_SENDER_ID')
        resValue 'string', 'project_id', cfg('firebase.projectId', 'FIREBASE_PROJECT_ID')
        resValue 'string', 'google_api_key', cfg('firebase.apiKey', 'FIREBASE_API_KEY')
        buildConfigField 'String', 'PHONE_RUNNER_WORKER_URL',
            '"https://phone-runner-wake.jawteng.workers.dev"'
        buildConfigField 'String', 'PHONE_RUNNER_BOOTSTRAP_TOKEN',
            '"' + cfg('phoneRunner.bootstrapToken', 'PHONE_RUNNER_BOOTSTRAP_TOKEN') + '"'
        buildConfigField 'boolean', 'PHONE_RUNNER_AUTO_ENROLL', 'true'
    }

    buildFeatures {
        buildConfig true
        resValues true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (!signingStoreFile.isEmpty()) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            if (!signingStoreFile.isEmpty()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
}
