# Legacy workflow retained for traceability. Automatic push triggers are intentionally disabled.
name: Phone Runner Production Deploy (manual legacy only)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Install Firebase CLI and helper dependencies
        run: |
          npm install --global firebase-tools@15.25.1
          python -m pip install --disable-pip-version-check pexpect

      - name: Authorize Google, create FCM service account, authorize Cloudflare, deploy Worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/phone_runner_production_deploy.py
