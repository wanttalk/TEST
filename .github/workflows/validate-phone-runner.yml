name: Validate Phone Runner (no secrets)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Worker contract
        working-directory: phone-runner-worker
        run: |
          npm install --no-audit --no-fund
          npm test

  apk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - name: Compile debug APK
        working-directory: phone-runner-app
        run: gradle :app:assembleDebug --stacktrace
