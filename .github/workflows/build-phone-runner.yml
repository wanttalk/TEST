name: Build Phone Runner APK

on:
  workflow_dispatch:
    inputs:
      firebase_application_id:
        description: "Firebase mobilesdk_app_id (google_app_id)"
        required: false
        type: string
      firebase_sender_id:
        description: "Firebase project_number / sender ID"
        required: false
        type: string
      firebase_project_id:
        description: "Firebase project_id"
        required: false
        type: string
      firebase_api_key:
        description: "Firebase Android API key"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FIREBASE_APPLICATION_ID: ${{ inputs.firebase_application_id || '' }}
      FIREBASE_SENDER_ID: ${{ inputs.firebase_sender_id || '' }}
      FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id || '' }}
      FIREBASE_API_KEY: ${{ inputs.firebase_api_key || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        working-directory: phone-runner-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: phone-runner-debug-apk
          path: phone-runner-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
