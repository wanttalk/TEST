<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16213a">
<title>好眠六週</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600&display=swap">
<style>
/* Layout: one narrow column like a clinic sleep log, fixed bottom tab bar on phones. */
:root {
  --bg: #edf1f6;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --ink: #16213a;
  --muted: #56637d;
  --line: #d4dbe6;
  --accent: #3446a8;
  --accent-ink: #ffffff;
  --sleep: #2f4c86;
  --bed: #c3cee0;
  --good: #23764a;
  --warn: #9a5d00;
  --bad: #b03636;
  --good-bg: #e3f2e9;
  --warn-bg: #fbf0dc;
  --bad-bg: #f9e3e3;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1322; --surface: #161f33; --surface-2: #1c2740; --ink: #e5eaf4; --muted: #9ba7bf;
    --line: #2b3753; --accent: #a3b2ff; --accent-ink: #0d1322; --sleep: #86a6e6; --bed: #34415f;
    --good: #6cc995; --warn: #e8b157; --bad: #f08a8a; --good-bg: #173326; --warn-bg: #3a2d14; --bad-bg: #3b1d22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1322; --surface: #161f33; --surface-2: #1c2740; --ink: #e5eaf4; --muted: #9ba7bf;
  --line: #2b3753; --accent: #a3b2ff; --accent-ink: #0d1322; --sleep: #86a6e6; --bed: #34415f;
  --good: #6cc995; --warn: #e8b157; --bad: #f08a8a; --good-bg: #173326; --warn-bg: #3a2d14; --bad-bg: #3b1d22;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.65;
}
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 104px; display: grid; gap: 18px; }
header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-top: 8px; }
.brand { font-family: var(--font-display); font-size: 22px; letter-spacing: .04em; margin: 0; }
.store { font-size: 12px; color: var(--muted); }
h2 { font-family: var(--font-display); font-size: 19px; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
.hero { padding: 20px 16px; gap: 6px; }
.window { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.window .t { font-family: var(--font-num); font-size: 40px; line-height: 1.1; letter-spacing: -.02em; }
.window .arrow { color: var(--muted); font-size: 22px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; }
.stat .v { font-family: var(--font-num); font-size: 20px; }
.stat .k { font-size: 12px; color: var(--muted); }
.callout { border-left: 4px solid var(--accent); background: var(--surface-2); padding: 12px 14px; border-radius: 0 8px 8px 0; display: grid; gap: 8px; }
.callout.warn { border-color: var(--warn); background: var(--warn-bg); }
.callout.bad { border-color: var(--bad); background: var(--bad-bg); }
.callout.good { border-color: var(--good); background: var(--good-bg); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 500; white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button, .btn {
  font: inherit; font-size: 14px; font-weight: 500; border-radius: 8px; padding: 9px 16px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.danger { color: var(--bad); border-color: var(--bad); }
button.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: not-allowed; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
input, select, textarea {
  font: inherit; font-size: 15px; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0;
}
input[type="time"], input[type="number"], input[type="date"] { font-family: var(--font-num); }
textarea { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--ink); padding: 6px 0; }
.check input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--accent); }
.checks { display: grid; gap: 2px; }
.score { font-family: var(--font-num); font-size: 28px; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px;
}
nav.tabs button { border: 0; background: none; padding: 8px 2px; font-size: 13px; color: var(--muted); border-radius: 8px; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--surface-2); font-weight: 700; }
.list { display: grid; gap: 0; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .d { font-family: var(--font-num); font-size: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-family: var(--font-num); font-size: 11px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
details.lesson { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.lesson > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
details.lesson > summary::-webkit-details-marker { display: none; }
details.lesson .wk { font-family: var(--font-num); font-size: 12px; color: var(--muted); width: 3.2em; }
details.lesson .body { padding: 0 16px 16px; display: grid; gap: 12px; }
details.lesson .body ul, details.lesson .body ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.evidence { font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.pacer { display: grid; place-items: center; gap: 10px; padding: 12px 0; }
.orb { width: 120px; height: 120px; border-radius: 50%; background: var(--sleep); opacity: .85; transform: scale(.6); transition-property: transform; transition-timing-function: ease-in-out; }
.orb.in { transform: scale(1); transition-duration: 4s; }
.orb.out { transform: scale(.6); transition-duration: 6s; }
@media (prefers-reduced-motion: reduce) { .orb { transition: none !important; } }
.cue { font-size: 18px; font-weight: 500; }
.tip { position: fixed; z-index: 9; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 6px 8px; border-radius: 6px; max-width: 220px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 10; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); }
.modal { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: grid; place-items: center; padding: 16px; }
.modal .panel { width: min(560px, 100%); max-height: 85vh; overflow: auto; }
.modal textarea { min-height: 240px; font-family: var(--font-num); font-size: 12px; }
.err { color: var(--bad); font-size: 13px; }
a { color: var(--accent); }
.sources li { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">好眠六週</h1>
    <span class="store" id="store">本機儲存</span>
  </header>
  <main id="main" class="stack"></main>
</div>
<nav class="tabs" id="tabs" hidden>
  <button type="button" data-tab="today">今天</button>
  <button type="button" data-tab="diary">日記</button>
  <button type="button" data-tab="trends">趨勢</button>
  <button type="button" data-tab="learn">課程</button>
  <button type="button" data-tab="settings">設定</button>
</nav>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="modal" id="modal" hidden></div>

<script>
"use strict";
/* ---------- constants ---------- */
const LS_KEY = "sleep-cbti.v1";
const MIN_WINDOW = 330;   // 5.5 h: conservative floor for self-guided use (clinics commonly use 5 h)
const MAX_WINDOW = 540;   // 9 h
const BASELINE_NIGHTS = 7;

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const clone = o => JSON.parse(JSON.stringify(o));
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function todayISO() { return iso(new Date()); }
function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) {
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5);
}
function toMin(t) { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; }
function fromMin(m) { m = ((Math.round(m) % 1440) + 1440) % 1440; return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
/* minutes since 12:00 of the evening before, so a night never wraps */
function rel(t) { const m = toMin(t); return m < 720 ? m + 720 : m - 720; }
function hm(min) { if (min == null || isNaN(min)) return "—"; min = Math.round(min); return Math.floor(min / 60) + ":" + pad(min % 60); }
function dur(min) {
  if (min == null || isNaN(min)) return "—";
  min = Math.round(min); const h = Math.floor(min / 60), m = min % 60;
  return h ? h + " 小時" + (m ? " " + m + " 分" : "") : m + " 分";
}
const round15 = m => Math.round(m / 15) * 15;
function md(s) { const d = parseISO(s); return (d.getMonth() + 1) + "/" + d.getDate(); }
function wd(s) { return "日一二三四五六"[parseISO(s).getDay()]; }
function pct(x) { return x == null ? "—" : Math.round(x) + "%"; }

/* ---------- state ---------- */
function blank() { return { v: 1, profile: null, diary: {} }; }
let state = blank();
let view = "today";
let editing = null;          // date of diary entry being edited
let pendingDelete = null;
let pendingReset = false;
let screenDraft = null;

function loadLocal() {
  try { const raw = localStorage.getItem(LS_KEY); if (raw) { const s = JSON.parse(raw); if (s && s.diary) return s; } } catch (e) {}
  return null;
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

/* cloud: each viewer's own private subtree data/users/<id>/ in the artifact db */
let cloud = null;
let chain = Promise.resolve();
function enqueue(fn) {
  chain = chain.then(fn).catch(e => toast("同步失敗：" + (e && e.code ? e.code : "請稍後再試") + "，資料仍保存在這台裝置"));
  return chain;
}
let profileTimer = null;
function saveProfile() {
  saveLocal();
  if (!cloud) return;
  clearTimeout(profileTimer);
  profileTimer = setTimeout(() => enqueue(() => cloud.col.doc("profile").set(clone(state.profile))), 500);
}
function saveEntry(date) {
  saveLocal();
  if (cloud) enqueue(() => cloud.col.doc("n-" + date).set(clone(state.diary[date])));
}
function removeEntry(date) {
  saveLocal();
  if (cloud) enqueue(() => cloud.col.doc("n-" + date).delete());
}
function uploadAll() {
  if (!cloud) return;
  if (state.profile) enqueue(() => cloud.col.doc("profile").set(clone(state.profile)));
  Object.keys(state.diary).forEach(d => enqueue(() => cloud.col.doc("n-" + d).set(clone(state.diary[d]))));
}
async function initCloud() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const col = db.collection("data/users/" + uid);
    const snap = await col.get();
    const s = blank();
    snap.docs.forEach(d => {
      const body = clone(d.data() || {});
      if (d.id === "profile") s.profile = body;
      else if (d.id.startsWith("n-")) s.diary[d.id.slice(2)] = body;
    });
    cloud = { db, uid, col };
    const cloudEmpty = !s.profile && !Object.keys(s.diary).length;
    const localHas = state.profile || Object.keys(state.diary).length;
    if (cloudEmpty && localHas) uploadAll();
    else state = s;
    saveLocal();
    $("#store").textContent = "已同步到你的帳號（只有你看得到）";
    render();
  } catch (e) {
    $("#store").textContent = "本機儲存（雲端同步無法使用）";
  }
}

/* ---------- sleep math ---------- */
function calc(e) {
  const b = rel(e.bed), l = rel(e.lights), w = rel(e.wake), o = rel(e.out);
  const sol = +e.sol || 0, waso = +e.waso || 0;
  const tib = o - b, tst = Math.max(0, w - l - sol - waso);
  return { tib, tst, se: tib > 0 ? Math.min(100, tst / tib * 100) : 0, sol, waso };
}
function validate(e) {
  if (!e.date) return "請選擇起床那天的日期。";
  if (!e.bed || !e.lights || !e.wake || !e.out) return "請填完四個時間。";
  const b = rel(e.bed), l = rel(e.lights), w = rel(e.wake), o = rel(e.out);
  if (l < b) return "關燈時間不能早於上床時間。";
  if (w <= l) return "最後醒來時間要晚於關燈時間。";
  if (o < w) return "下床時間不能早於最後醒來時間。";
  if (o - b > 16 * 60) return "在床時間超過 16 小時，請檢查時間（上午/下午）。";
  if ((+e.sol || 0) + (+e.waso || 0) > w - l) return "入睡時間加夜醒時間，超過了關燈到醒來的總時間。";
  if (e.date > todayISO()) return "不能記錄未來的日期。";
  return null;
}
function entries() {
  return Object.keys(state.diary).sort().map(date => ({ date, ...state.diary[date], c: calc(state.diary[date]) }));
}
function summarize(list) {
  if (!list.length) return null;
  return {
    n: list.length,
    se: mean(list.map(e => e.c.se)), tst: mean(list.map(e => e.c.tst)), tib: mean(list.map(e => e.c.tib)),
    sol: mean(list.map(e => e.c.sol)), waso: mean(list.map(e => e.c.waso)),
  };
}
function last7() { const t = todayISO(); return entries().filter(e => daysBetween(e.date, t) < 7); }
function seClass(se) { return se >= 85 ? "good" : se >= 75 ? "warn" : "bad"; }
function seLabel(se) { return se >= 85 ? "良好" : se >= 75 ? "普通" : "偏低"; }

/* ---------- screening ---------- */
const CONTRA = [
  ["bipolar", "曾被診斷雙極性疾患（躁鬱症）或有躁期發作"],
  ["epilepsy", "有癲癇或曾經抽搐發作"],
  ["parasomnia", "有夢遊、夢中拳打腳踢等異常睡眠行為"],
  ["falls", "行動不穩、容易跌倒（例如需要拐杖或曾在夜間跌倒）"],
  ["vigilance", "工作需要高度警覺，例如職業駕駛、操作重機械、輪班醫護"],
  ["osa", "已確診睡眠呼吸中止，但目前沒有治療"],
];
const STOPBANG = [
  ["s", "打鼾很大聲（隔著門都聽得到）"],
  ["t", "白天常覺得疲倦、想睡，甚至開車時打瞌睡"],
  ["o", "有人看到你睡覺時呼吸停止，或你會嗆醒"],
  ["p", "有高血壓，或正在吃降血壓藥"],
  ["b", "BMI 超過 35"],
  ["a", "年齡超過 50 歲"],
  ["n", "頸圍超過 40 公分"],
  ["g", "生理男性"],
];
function stopBangScore(sc) { return STOPBANG.filter(([k]) => sc.stopbang[k]).length; }
function restrictionBlockers(sc) {
  const out = [];
  if (!sc) return out;
  if (CONTRA.some(([k]) => k !== "osa" && sc.contra[k]) && !sc.doctorOk) out.push("contra");
  if ((sc.contra.osa || stopBangScore(sc) >= 3) && !sc.osaCleared) out.push("osa");
  return out;
}
function mode() { return state.profile && restrictionBlockers(state.profile.screening).length === 0 ? "standard" : "gentle"; }

/* ---------- sleep window ---------- */
function windows() { return (state.profile && state.profile.windows) || []; }
function curWin() { const w = windows(); return w.length ? w[w.length - 1] : null; }
function winFor(date) { let r = null; for (const w of windows()) if (w.start < date) r = w; return r; }
function bedtimeOf(w) { return fromMin(toMin(w.wake) - w.minutes); }
function baselineProposal() {
  if (curWin()) return null;
  const t = todayISO();
  const recent = entries().filter(e => daysBetween(e.date, t) < 14);
  if (recent.length < BASELINE_NIGHTS) return { ready: false, n: recent.length };
  const s = summarize(recent);
  let m = Math.max(MIN_WINDOW, round15(s.tst));
  m = Math.min(m, Math.max(MIN_WINDOW, round15(s.tib)), MAX_WINDOW);
  return { ready: true, ...s, minutes: m };
}
function titration() {
  const w = curWin(); if (!w) return null;
  const due = addDays(w.start, 7), t = todayISO();
  if (t < due) return { due: false, daysLeft: daysBetween(t, due) };
  const recent = entries().filter(e => e.date > w.start).slice(-7);
  if (recent.length < 5) return { due: true, enough: false, n: recent.length };
  const se = mean(recent.map(e => e.c.se));
  const older = !!state.profile.older;
  const hi = older ? 85 : 90, lo = older ? 80 : 85;
  let delta = 0;
  if (se >= hi) delta = 15; else if (se < lo) delta = -15;
  const minutes = Math.max(MIN_WINDOW, Math.min(MAX_WINDOW, w.minutes + delta));
  let decision;
  if (minutes > w.minutes) decision = "延長 15 分鐘";
  else if (minutes < w.minutes) decision = "縮短 15 分鐘";
  else if (delta < 0) decision = "已到下限 " + hm(MIN_WINDOW) + "，維持不變";
  else if (delta > 0) decision = "已到上限，維持不變";
  else decision = "維持不變";
  return { due: true, enough: true, n: recent.length, se, hi, lo, minutes, delta: minutes - w.minutes, decision };
}
function programAnchor() {
  const w = windows();
  if (w.length) return w[0].start;
  if (mode() === "gentle") {
    const e = entries(); if (e.length >= BASELINE_NIGHTS) return e[BASELINE_NIGHTS - 1].date;
  }
  return null;
}
function programWeek() {
  const a = programAnchor(); if (!a) return 0;
  return Math.min(6, 1 + Math.floor(daysBetween(a, todayISO()) / 7));
}

function render() {
  const main = $("#main");
  const needsOnboard = !state.profile;
  $("#tabs").hidden = needsOnboard || view === "screen";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === view ? "page" : "false"));
  stopPacer();
  if (needsOnboard || view === "screen") main.innerHTML = renderScreen(needsOnboard);
  else if (view === "diary") main.innerHTML = renderDiary();
  else if (view === "trends") main.innerHTML = renderTrends();
  else if (view === "learn") main.innerHTML = renderLearn();
  else if (view === "settings") main.innerHTML = renderSettings();
  else main.innerHTML = renderToday();
}

function chartWidth() { const m = $("#main"); return Math.max(300, Math.min(640, (m ? m.clientWidth : 640) - 34)); }
function seChart(list) {
  const W = chartWidth(), H = 230, L = 40, R = 16, T = 14, B = 30;
  const older = state.profile.older;
  const hi = older ? 85 : 90, lo = older ? 80 : 85;
  const minSE = Math.min(50, Math.floor(Math.min(...list.map(e => e.c.se)) / 10) * 10);
  const y = v => T + (100 - v) / (100 - minSE) * (H - T - B);
  const d0 = list[0].date, span = Math.max(1, daysBetween(d0, list[list.length - 1].date));
  const x = d => L + daysBetween(d0, d) / span * (W - L - R);
  const ticks = [];
  for (let v = minSE; v <= 100; v += 10) ticks.push(v);
  const pts = list.map(e => `${x(e.date).toFixed(1)},${y(e.c.se).toFixed(1)}`).join(" ");
  const xl = [list[0], list[Math.floor((list.length - 1) / 2)], list[list.length - 1]].filter((e, i, a) => a.indexOf(e) === i);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="每晚睡眠效率折線圖">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    <rect x="${L}" y="${y(100)}" width="${W - L - R}" height="${y(hi) - y(100)}" fill="var(--good-bg)"/>
    <line x1="${L}" x2="${W - R}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--good)" stroke-dasharray="4 4" stroke-width="1"/>
    <line x1="${L}" x2="${W - R}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${W - R}" y="${y(hi) - 4}" text-anchor="end">延長 ${hi}%</text>
    <text x="${W - R}" y="${y(lo) + 13}" text-anchor="end">縮短 ${lo}%</text>
    <polyline points="${pts}" fill="none" stroke="var(--sleep)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${list.map(e => `<circle cx="${x(e.date)}" cy="${y(e.c.se)}" r="4" fill="var(--sleep)" stroke="var(--surface)" stroke-width="2"/><circle class="hit" cx="${x(e.date)}" cy="${y(e.c.se)}" r="14" fill="transparent" data-tip="${md(e.date)} 週${wd(e.date)}｜效率 ${pct(e.c.se)}｜睡 ${hm(e.c.tst)}｜在床 ${hm(e.c.tib)}"/>`).join("")}
    ${xl.map(e => `<text x="${x(e.date)}" y="${H - 8}" text-anchor="${e === list[0] && list.length > 1 ? "start" : e === list[list.length - 1] && list.length > 1 ? "end" : "middle"}">${md(e.date)}</text>`).join("")}
  </svg>`;
}

function sleepLog(list) {
  const W = chartWidth(), L = 78, R = 10, rowH = 24, T = 22;
  const H = T + list.length * rowH + 6;
  const a0 = 360, a1 = 1440;  // 18:00 → 12:00 next day, in minutes since noon
  const x = r => L + (Math.max(a0, Math.min(a1, r)) - a0) / (a1 - a0) * (W - L - R);
  const hours = [18, 21, 0, 3, 6, 9, 12];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="睡眠日誌圖：每晚在床與睡著的時段">
    ${hours.map(h => { const r = rel(pad(h) + ":00") || (h === 12 ? 1440 : 0); return `<line x1="${x(r)}" x2="${x(r)}" y1="${T - 4}" y2="${H - 4}" stroke="var(--line)" stroke-width="1"/><text x="${x(r)}" y="${T - 8}" text-anchor="middle">${pad(h)}</text>`; }).join("")}
    ${list.map((e, i) => {
      const y0 = T + i * rowH + 4, h = rowH - 8;
      const win = winFor(e.date);
      const winRect = win ? `<rect x="${x(rel(bedtimeOf(win)))}" y="${y0 - 2}" width="${Math.max(0, x(rel(win.wake)) - x(rel(bedtimeOf(win))))}" height="${h + 4}" fill="none" stroke="var(--accent)" stroke-dasharray="3 3" stroke-width="1.5" rx="3"/>` : "";
      const sStart = rel(e.lights) + e.c.sol, sEnd = rel(e.wake);
      return `<text x="4" y="${y0 + h - 3}">${md(e.date)} ${wd(e.date)}</text>
        <rect x="${x(rel(e.bed))}" y="${y0}" width="${Math.max(0, x(rel(e.out)) - x(rel(e.bed)))}" height="${h}" rx="3" fill="var(--bed)"/>
        ${sEnd > sStart ? `<rect x="${x(sStart)}" y="${y0 + 3}" width="${Math.max(0, x(sEnd) - x(sStart))}" height="${h - 6}" rx="2" fill="var(--sleep)"/>` : ""}
        ${winRect}
        <rect class="hit" x="${L}" y="${y0 - 2}" width="${W - L - R}" height="${h + 4}" fill="transparent" data-tip="${md(e.date)}｜上床 ${esc(e.bed)}・關燈 ${esc(e.lights)}・入睡 ${e.c.sol} 分・夜醒 ${e.c.waso} 分・醒來 ${esc(e.wake)}・下床 ${esc(e.out)}"/>`;
    }).join("")}
  </svg>`;
}

function weeklyTable() {
  const all = entries(); if (!all.length) return "";
  const anchor = programAnchor();
  const base = anchor ? addDays(anchor, -7) : all[0].date;
  const groups = {};
  all.forEach(e => { const k = Math.floor(daysBetween(base, e.date) / 7); (groups[k] = groups[k] || []).push(e); });
  const keys = Object.keys(groups).map(Number).sort((a, b) => a - b);
  return `<div class="tablewrap"><table>
    <thead><tr><th>週次</th><th>晚數</th><th>效率</th><th>睡眠</th><th>在床</th><th>入睡(分)</th><th>夜醒(分)</th></tr></thead>
    <tbody>${keys.map(k => { const s = summarize(groups[k]); return `<tr><td>${k < 0 ? "之前" : "第 " + k + " 週"}</td><td>${s.n}</td><td>${pct(s.se)}</td><td>${hm(s.tst)}</td><td>${hm(s.tib)}</td><td>${Math.round(s.sol)}</td><td>${Math.round(s.waso)}</td></tr>`; }).join("")}</tbody>
  </table></div>`;
}

/* ---------- breathing pacer ---------- */
let pacerTimer = null, pacerEnd = 0, pacerPhase = "out", pacerPhaseEnd = 0;
function stopPacer() { if (pacerTimer) { clearInterval(pacerTimer); pacerTimer = null; } }
function startPacer() {
  stopPacer();
  pacerEnd = Date.now() + 5 * 60 * 1000; pacerPhase = "out"; pacerPhaseEnd = 0;
  const tick = () => {
    const now = Date.now(), orb = $("#orb"), cue = $("#cue"), left = $("#pacer-left");
    if (!orb) { stopPacer(); return; }
    if (now >= pacerEnd) { stopPacer(); orb.className = "orb"; cue.textContent = "完成。注意身體現在的感覺。"; left.textContent = "0:00"; return; }
    if (now >= pacerPhaseEnd) {
      pacerPhase = pacerPhase === "in" ? "out" : "in";
      pacerPhaseEnd = now + (pacerPhase === "in" ? 4000 : 6000);
      orb.className = "orb " + pacerPhase;
      cue.textContent = pacerPhase === "in" ? "用鼻子慢慢吸氣… 4 秒" : "慢慢吐氣… 6 秒";
    }
    const s = Math.ceil((pacerEnd - now) / 1000);
    left.textContent = Math.floor(s / 60) + ":" + pad(s % 60);
  };
  tick();
  pacerTimer = setInterval(tick, 250);
}

function csv() {
  const head = ["日期", "上床", "關燈", "入睡分鐘", "夜醒次數", "夜醒分鐘", "最後醒來", "下床", "品質1-5", "小睡分鐘", "咖啡因", "酒精", "助眠藥", "在床分鐘", "睡眠分鐘", "睡眠效率%", "備註"];
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = entries().map(e => [e.date, e.bed, e.lights, e.c.sol, e.wakes ?? "", e.c.waso, e.wake, e.out, e.quality, e.nap, e.caffeine ? 1 : 0, e.alcohol ? 1 : 0, e.meds ? 1 : 0, e.c.tib, e.c.tst, Math.round(e.c.se), e.notes]);
  return "﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\n");
}
async function offerFile(filename, text) {
  if (window.claude && typeof window.claude.use === "function") {
    let dl = null;
    try { dl = await window.claude.use("downloads"); } catch (e) {}
    if (dl) {
      try { await dl.save({ filename, data: text }); toast("已存檔"); return; }
      catch (e) { if (e && e.code === "declined") return; }
    }
    showText(filename, text);
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" }));
  a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function showText(filename, text) {
  const m = $("#modal");
  m.innerHTML = `<div class="panel"><h3>${esc(filename)}</h3><p class="small muted">這裡無法直接下載。請複製下面的內容，貼到記事本後另存檔案。</p><textarea id="modal-text" readonly>${esc(text)}</textarea><div class="btns"><button class="primary" data-act="copy">複製</button><button data-act="close-modal">關閉</button></div></div>`;
  m.hidden = false;
}
function importJSON(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { toast("檔案不是有效的備份格式"); return; }
  if (!data || typeof data.diary !== "object") { toast("檔案裡找不到睡眠日記"); return; }
  const ok = /^\d{4}-\d{2}-\d{2}$/;
  let n = 0;
  Object.keys(data.diary).forEach(d => { if (ok.test(d) && !validate({ date: d, ...data.diary[d] })) { state.diary[d] = data.diary[d]; n++; } });
  if (data.profile && data.profile.screening && data.profile.wakeTime) state.profile = data.profile;
  saveLocal(); uploadAll();
  toast("已匯入 " + n + " 晚的紀錄");
  render();
}

/* ---------- ui feedback ---------- */
let toastTimer = null;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2800); }

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const tab = ev.target.closest("[data-tab]");
  if (tab) { view = tab.dataset.tab; editing = null; pendingDelete = null; pendingReset = false; render(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "go") { view = b.dataset.v; render(); window.scrollTo(0, 0); }
  else if (act === "start-window") {
    const bp = baselineProposal(); if (!bp || !bp.ready) return;
    state.profile.windows = [{ start: todayISO(), minutes: bp.minutes, wake: state.profile.wakeTime, reason: "基線平均睡眠 " + hm(bp.tst) + "，效率 " + pct(bp.se) }];
    saveProfile(); toast("今晚開始新的睡眠時段"); render();
  } else if (act === "apply-titration") {
    const tt = titration(); const w = curWin(); if (!tt || !tt.enough) return;
    state.profile.windows.push({ start: todayISO(), minutes: tt.minutes, wake: w.wake, reason: "效率 " + pct(tt.se) + "，" + tt.decision });
    saveProfile(); toast("已套用新時段"); render();
  } else if (act === "edit") { editing = b.dataset.d; pendingDelete = null; render(); window.scrollTo(0, 0); }
  else if (act === "cancel-edit") { editing = null; render(); }
  else if (act === "del") { pendingDelete = b.dataset.d; render(); }
  else if (act === "del-cancel") { pendingDelete = null; render(); }
  else if (act === "del-confirm") { const d = b.dataset.d; delete state.diary[d]; removeEntry(d); pendingDelete = null; if (editing === d) editing = null; toast("已刪除 " + md(d)); render(); }
  else if (act === "rescreen") { screenDraft = null; view = "screen"; render(); window.scrollTo(0, 0); }
  else if (act === "cancel-screen") { screenDraft = null; view = "settings"; render(); }
  else if (act === "pacer") startPacer();
  else if (act === "export-csv") offerFile("睡眠日記-" + todayISO() + ".csv", csv());
  else if (act === "export-json") offerFile("睡眠日記備份-" + todayISO() + ".json", JSON.stringify(state, null, 2));
  else if (act === "reset") { pendingReset = true; render(); }
  else if (act === "reset-cancel") { pendingReset = false; render(); }
  else if (act === "reset-confirm") {
    const dates = Object.keys(state.diary);
    state = blank(); saveLocal();
    if (cloud) { enqueue(() => cloud.col.doc("profile").delete()); dates.forEach(d => enqueue(() => cloud.col.doc("n-" + d).delete())); }
    pendingReset = false; view = "today"; screenDraft = null; render(); toast("已刪除全部紀錄");
  } else if (act === "copy") {
    const ta = $("#modal-text");
    try { await navigator.clipboard.writeText(ta.value); toast("已複製"); } catch (e) { ta.focus(); ta.select(); toast("已選取，請長按或用 Ctrl+C 複製"); }
  } else if (act === "close-modal") { $("#modal").hidden = true; }
});

document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.g && screenDraft) {
    if (el.dataset.g === "contra") screenDraft.contra[el.dataset.k] = el.checked;
    else if (el.dataset.g === "stopbang") screenDraft.stopbang[el.dataset.k] = el.checked;
    else if (el.dataset.g === "crisis") screenDraft.crisis = el.checked;
    else if (el.dataset.g === "flag") screenDraft[el.dataset.k] = el.checked;
    const wake = $("#s-wake").value, older = $("#s-older").checked, y = window.scrollY;
    render();
    $("#s-wake").value = wake; $("#s-older").checked = older;
    window.scrollTo(0, y);
    const again = document.getElementById(el.id); if (again) again.focus();
  } else if (el.dataset && el.dataset.hyg) {
    state.profile.checklist = state.profile.checklist || {};
    state.profile.checklist[el.dataset.hyg] = el.checked;
    saveProfile();
  } else if (el.id === "import-file" && el.files && el.files[0]) {
    const r = new FileReader();
    r.onload = () => importJSON(String(r.result));
    r.readAsText(el.files[0]);
  }
});

document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === "screen-form") {
    const wake = $("#s-wake").value || "07:00";
    const first = !state.profile;
    const prevMode = first ? null : mode();
    if (first) state.profile = { createdAt: todayISO(), wakeTime: wake, older: $("#s-older").checked, windows: [], checklist: {}, thoughts: [], screening: screenDraft };
    else { state.profile.screening = screenDraft; state.profile.older = $("#s-older").checked; setWake(wake); }
    screenDraft = null;
    saveProfile();
    view = "today";
    if (!first && prevMode !== mode()) toast(mode() === "standard" ? "已切換到完整版" : "已切換到溫和版");
    render(); window.scrollTo(0, 0);
  } else if (f.id === "diary-form") {
    const g = id => $("#" + id);
    const e = {
      date: g("f-date").value, bed: g("f-bed").value, lights: g("f-lights").value,
      sol: Math.max(0, +g("f-sol").value || 0), wakes: Math.max(0, +g("f-wakes").value || 0), waso: Math.max(0, +g("f-waso").value || 0),
      wake: g("f-wake").value, out: g("f-out").value, quality: +g("f-quality").value, nap: Math.max(0, +g("f-nap").value || 0),
      caffeine: g("f-caffeine").checked, alcohol: g("f-alcohol").checked, meds: g("f-meds").checked, notes: g("f-notes").value.trim(),
    };
    const err = validate(e);
    if (err) { const p = g("f-err"); p.textContent = err; p.hidden = false; return; }
    const { date, ...body } = e;
    const existed = !!state.diary[date] && editing !== date;
    state.diary[date] = body;
    saveEntry(date);
    editing = null;
    const c = calc(body);
    toast((existed ? "已覆蓋 " : "已儲存 ") + md(date) + "：睡眠效率 " + pct(c.se));
    render();
  } else if (f.id === "thought-form") {
    const sit = $("#t-sit").value.trim(), auto = $("#t-auto").value.trim(), alt = $("#t-alt").value.trim();
    if (!auto) { toast("請至少寫下腦中的想法"); return; }
    state.profile.thoughts = (state.profile.thoughts || []).concat([{ date: todayISO(), sit, auto, alt }]).slice(-50);
    saveProfile(); toast("已儲存"); render();
  } else if (f.id === "settings-form") {
    state.profile.older = $("#st-older").checked;
    setWake($("#st-wake").value || state.profile.wakeTime);
    saveProfile(); toast("已儲存"); render();
  }
});

function setWake(wake) {
  if (wake === state.profile.wakeTime) return;
  state.profile.wakeTime = wake;
  const w = curWin();
  if (w) {
    if (w.start === todayISO()) w.wake = wake;
    else state.profile.windows.push({ start: todayISO(), minutes: w.minutes, wake, reason: "更改起床時間" });
  }
}

/* tooltip for chart marks */
function showTip(target, x, y) {
  const tip = $("#tip"); tip.textContent = target.dataset.tip; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x - r.width / 2)) + "px";
  tip.style.top = Math.max(8, y - r.height - 12) + "px";
}
document.addEventListener("pointerover", ev => { const t = ev.target.closest && ev.target.closest(".hit"); if (t) showTip(t, ev.clientX, ev.clientY); });
document.addEventListener("pointermove", ev => { const t = ev.target.closest && ev.target.closest(".hit"); if (t) showTip(t, ev.clientX, ev.clientY); else $("#tip").hidden = true; });
document.addEventListener("pointerdown", ev => { const t = ev.target.closest && ev.target.closest(".hit"); if (t) showTip(t, ev.clientX, ev.clientY); else $("#tip").hidden = true; });
window.addEventListener("scroll", () => { $("#tip").hidden = true; }, { passive: true });
let resizeTimer = null, lastWidth = window.innerWidth;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (view === "trends" && window.innerWidth !== lastWidth) { lastWidth = window.innerWidth; render(); } }, 200);
});

/* ---------- boot ---------- */
const local = loadLocal();
if (local) state = local;
render();
initCloud();
</script>
</body>
</html>
